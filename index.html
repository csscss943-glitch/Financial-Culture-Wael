 الأشياء المختلفة ومقارنتها - مثال: إذا كان ثمن 10 كجم أرز 250 جنيه وثمن الكرة 120 جنيه تبين أن ثمن الأرز أكبر. 2- وسيط للتبادل: بالنقود تسدد أثمان السلع والخدمات فيصير التبادل أيسر - الدفع نقدا والدفع بخصم من الحساب المصرفي مثالان. 3- مخزن للقيمة: بخلاف الطعام الذي يفسد تحفظ قيمتها مدة طويلة نسبيا - غير أنها لا تحفظ قيمتها كاملة في كل الأحوال بسبب التضخم - مثال: ما يشترى بمئة جنيه قبل 20 عاما يشترى اليوم بـ 120 فالقوة الشرائية انخفضت."},{h:"النقود ووسائل الدفع اليوم",p:"النقود الإلكترونية: قيمة نقدية مستندة إلى أموال يدفعها المستعمل مقدما تسجل إلكترونيا وتتخذ وسيلة للدفع - يتيح الوصول إليها ببطاقة أو محفظة هاتف. آليات المدفوعات الرقمية: طرائق للدفع بسجلات إلكترونية أو باتصالات من غير تبادل مباشر للنقد - يختلف موضع حفظ الأموال ووقت الدفع. حساب مصرفي: نظام يدير فيه البنك الأموال ودائع - إذا استعمل في الدفع خصم المبلغ من الرصيد. بطاقة للدفع: أداة تتيح الوصول إلى أموال أو إلى حد ائتماني - يختلف مصدر الأموال ووقت الدفع. محفظة الهاتف المحمول: خدمة تتيح الدفع بالنقود الإلكترونية والحسابات المصرفية وبطاقات الدفع بهاتف محمول. البنك المركزي: بنك ذو مهام خاصة يصدر أوراق النقد ويضبط كمية النقود المتداولة للمحافظة على استقرار الأسعار وسلامة النظام المصرفي - في مصر يتولى هذا الدور البنك المركزي المصري CBE. النقد القانوني Legal Tender: نقد تصدره حكومة أو بنك مركزي ويعترف به القانون رسميا وسيلة للوفاء بالديون وله قوة إبراء - من أوراق ومسكوكات معرض للضياع والسرقة - ويقلل التضخم ما يشترى بالمبلغ نفسه. CBDC: صورة رقمية من النقود يصدرها بنك مركزي وتقوم بعملة الدولة - يصمم كل بنك نظامها في إطار قانون دولته - يختلف مركزها القانوني وأوجه استعمالها وضوابط مخاطرها - لا تتخذ صورة مسكوكات بل بيانات رقمية فقط. الأصول المشفرة Crypto-assets: أصول رقمية لا تصدرها في العموم جهات عامة كالبنوك المركزية - مال قائم في صورة بيانات إلكترونية يملك ويتداول عبر الإنترنت - أشهرها البيتكوين والإيثيريوم - ليست نقدا قانونيا - أسعارها تتقلب بشدة لتأثرها بالعرض والطلب - مخاطرها: احتيال وفقدان الوصول ومحدودية حماية المستعمل. الشمول المالي Financial Inclusion: أن تكون الخدمات المالية كالحسابات والتحويلات في متناول الناس جميعا - بعض خدمات النقود الإلكترونية ومحافظ الهاتف لا تشترط حسابا مصرفيا فتيسر الوصول لمن يصعب عليه فتح حساب - العملات الرقمية للبنوك المركزية قد تعين على توسيع الشمول حسب تصميمها."}],questions:[{id:1,type:"tf",q:"يقصد بالمقايضة نظام تبادل الممتلكات والخدمات بصورة مباشرة دون استخدام النقود",isCorrect:!0},{id:2,type:"tf",q:"نظام المقايضة لا يتطلب ما يعرف بالتوافق المزدوج للرغبات",isCorrect:!1,explanation:"بل يتطلب التوافق المزدوج للرغبات"},{id:3,type:"tf",q:"أوراق النقد الإلزامية الحديثة يمكن فكها وتحويلها بطلب إلى قدر ثابت من الذهب أو الفضة",isCorrect:!1,explanation:"دي القابلة للتحويل، الإلزامية غير مكفولة"},{id:4,type:"tf",q:"العامل الأساسي في قبول أوراق النقد الإلزامية هو الثقة المحمية بالتشريعات والقوانين",isCorrect:!0},{id:5,type:"tf",q:"تعتبر النقود مقياسا للقيمة عندما تستخدم كوسيط مباشر في الشراء",isCorrect:!1,explanation:"دي وظيفة وسيط للتبادل"},{id:6,type:"tf",q:"ظاهرة التضخم تعني الارتفاع العام والمستمر في مستويات أسعار السلع",isCorrect:!0},{id:7,type:"tf",q:"بقاء مقدار المدخرات ثابتا مع ارتفاع الأسعار يؤدي لزيادة قوتها الشرائية",isCorrect:!1,explanation:"يؤدي لانخفاضها"},{id:8,type:"tf",q:"العملة الرقمية للبنك المركزي CBDC تعتبر نقدا قانونيا رسميا يصدره البنك المركزي",isCorrect:!0},{id:9,type:"tf",q:"الأصول المشفرة مثل البيتكوين نقود قانونية معتمدة ومضمونة من البنوك المركزية",isCorrect:!1,explanation:"ليست نقد قانوني"},{id:10,type:"tf",q:"تساهم خدمات النقود الإلكترونية والمحافظ المحمولة في تعزيز الشمول المالي",isCorrect:!0},{id:11,type:"fill",q:"النظام القديم تبادل سلعة بسلعة يسمى ........",answer:"المقايضة",sentence:"النظام القديم تبادل سلعة بسلعة يسمى المقايضة"},{id:12,type:"fill",q:"من أبرز عيوب المقايضة ضرورة توفير شرط ........",answer:"التوافق المزدوج للرغبات",sentence:"من أبرز عيوب المقايضة ضرورة توفير شرط التوافق المزدوج للرغبات"},{id:13,type:"fill",q:"أوراق النقد الإلزامية تعتمد في قبولها القانوني على عامل ........ بالدولة والبنك المركزي",answer:"الثقة",sentence:"أوراق النقد الإلزامية تعتمد في قبولها القانوني على عامل الثقة بالدولة والبنك لب الحاد هي",options:[{k:"أ",v:"الأصول المشفرة"},{k:"ب",v:"النقد القانوني"},{k:"ج",v:"الودائع"},{k:"د",v:"الشيكات"}],correct:"أ",correctText:"الأصول المشفرة"},{id:40,type:"mcq",q:"تقديم خدمات لأصحاب الدخل المنخفض بدون حسابات بنكية يسمى",options:[{k:"أ",v:"التضخم"},{k:"ب",v:"الشمول المالي"},{k:"ج",v:"المقايضة"},{k:"د",v:"الاحتكار"}],correct:"ب",correctText:"الشمول المالي"}]},{id:"finance",icon:"\uD83C\uDFE6",title:"دور التمويل",count:40,short:"الدرس الثاني",explanation:[{h:"ما التمويل",p:"توفير الأموال اللازمة لفرد أو منشأة أو مشروع بنقلها من الوحدات ذات الفائض إلى الوحدات ذات العجز - ينقسم لتمويل مباشر وغير مباشر."},{h:"التمويل المباشر وغير المباشر",p:"التمويل المباشر: تحصل به المنشآت على الأموال من المستثمرين مباشرة بإصدار أسهم أو سندات. السهم: وحدة ملكية في شركة تصدرها لتجمع أموالا لنشاطها. السند: أداة دين تصدرها حكومة أو شركة لتقترض من المستثمرين. التمويل غير المباشر: تجمع فيه المؤسسات المالية أموال المودعين ثم تقرضها للمنشآت أو الأفراد - قد تستخدم البنوك أموال الودائع في شراء أسهم وسندات إلا أن المودع لا يشتري أسهم الشركة بنفسه ولأن المال يمر بالبنك وسيطا عد تمويلا غير مباشر."},{h:"تكلفة استعمال الأموال والتمويل الجماعي",p:"قد يترتب أنواع مختلفة من التكاليف أو الالتزامات: فائدة ورسوم وأجرة ومبلغ ثابت يضاف لثمن السلعة وحصة من الربح - إذا اقتضت فائدة سميت النسبة التي تحسب بها سعر الفائدة - ينبغي تجنب إطلاق مصطلح واحد على كلها فهي تختلف. التمويل الجماعي: طريقة يقدم فيها كثير من الناس مبالغ صغيرة عبر الإنترنت لدعم نشاط أو مشروع - له صور متعددة وتختلف القواعد باختلاف طريقة الجمع وما يناله مقدموها - في مصر يجري وفق القوانين السارية."},{h:"أنواع المؤسسات المالية - البنوك",p:"المؤسسات المالية: منظمات تدعم حركة الأموال بتوفيرها وإدارتها ونقلها - منهم البنوك والمؤسسات غير المصرفية ومقدمو الخدمات البريدية. البنوك التجارية: بنوك ينتفع الناس فيها بخدمات مالية كالإيداع والسحب والدفع - تجمع الأموال من المودعين وتقرض المنشآت والأفراد - تؤدي دور الوسيط المالي الذي ينقل الأموال من فائض إلى عجز. البنك المركزي: يتولى إصدار أوراق النقد وصون استقرار الأسعار وضمان استقرار النظام المالي - لا يودع عنده عامة الناس وإنما معاملاته على الحكومة والبنوك التجارية - يضبط كمية النقود ويعين البنوك التجارية ويصون النظام الاقتصادي والثقة - في مصر البنك المركزي المصري وينظم النشاط المصرفي وأنظمة المدفوعات."},{h:"المؤسسات غير المصرفية والبريد",p:"المؤسسات غير المصرفية: تقدم خدمات مالية من غير أن تعمل بنوكا بترخيص وإشراف - قد تقدم تداول أوراق مالية وتأمين وتمويل استهلاكي ومتناهي الصغر - في مصر تنظمها الهيئة العامة للرقابة المالية FRA. شركات الأوراق المالية: تيسر بيع الأسهم والسندات وشرائها وتعين المنشآت على الحصول على الأموال. شركات التأمين: تجمع الأقساط من كثير من المشتركين وتؤدي تعويضا عند وقوع خسائر اقتصادية من أخطار محددة كالحوادث والمرض - التأمين لا يزيل الأخطار نفسها وإنما نظام للاستعداد لما تحدثه من خسائر. مؤسسات التمويل متناهي الصغر: تقدم قروضا صغيرة وخدمات مالية لمحدودي الدخل ولمن يصعب وصولهم للبنوك - قد تدعم استقرار المعيشة ونشاط المشروعات الصغيرة وتسهم في الحد من الفقر. مقدمو الخدمات البريدية: يقدمون في بعض الدول خدمات مالية مرخصا بها كالادخار والدفع والتحويل والتأمين إلى جانب خدماتهم البريدية - تختلف الخدمات من دولة لأخرى - في مصر البريد المصري يقدم خدمات مالية مرخصا بها."},{h:"التمويل يحرك المجتمع والشمول المالي",p:"استثمار المنشآت: ما تنفقه المنشآت على المصانع والآلات والمعدات والتقنية لتزيد إنتاجها وأرباحها مستقبلا. آثار الاستثمار: إن نجح قد ترتفع إنتاجية ويرتفع أرباح - إذا خلق وظائف أنفق العاملون أجورهم فزاد الطلب - ارتفاع الأرباح وتوسع الاستهلاك قد يزيدان الحصيلة الضريبية وتعينان على تمويل الخدمات العامة - التمويل ييسر انتقال الأموال للمنشآت والأفراد للاستثمارات الضرورية وبه يدوم دوران النقود ويتحقق النمو - لكن لا تقع تلقائيا وتتوقف على الطلب وتحسن الإنتاجية وشروط التمويل والتكاليف وطريقة التخطيط. الاستبعاد المالي: حالة يتعذر فيها على الناس الوصول للخدمات المالية بسبب عوامل اقتصادية أو جغرافية أو اجتماعية أو رقمية. الشمول المالي: أن تكون الخدمات المالية في متناول الناس جميعا. التكنولوجيا المالية FinTech: استعمال التقنية الرقمية لتيسير الخدمات المالية كالدفع بالهاتف والتحويلات أيسر وأكفأ - قد توسع الوصول وتقصر زمن المعاملة - وفي المقابل قد تنشأ مشكلات كالرسوم والاحتيال ومخاطر أمن البيانات وانقطاع الخدمة ويلزم قدر من الثقافة الرقمية. الجمعية ROSCA: صورة غير رسمية من جمعيات الادخار والإقراض الدوارة تقوم على الثقة بين المشتركين - يدفع المشتركون مبلغا ثابتا بانتظام ويقبض في كل دورة مشترك واحد المبلغ المجموع - قد تعين من يصعب وصوله للبنوك على الادخار - وفي المقابل قد يتخلف بعضهم عن الدفع وقد تنشأ منازعات."}],questions:[{id:1,type:"tf",q:"يعمل التمويل كجسر لنقل الموارد من فائض مالي لعجز مالي",isCorrect:!0},{id:2,type:"tf",q:"التمويل المباشر يتم بجمع الأموال من المستثمرين عبر إصدار الأسهم والسندات دون وسيط البنوك",isCorrect:!0},{id:3,type:"tf",q:"البنوك التجارية تقوم بالوساطة المالية عبر جمع الودائع وإقراضها",isCorrect:!0},{id:4,type:"tf",q:"يقتصر دور البنك المركزي على قبول الودائع وتقديم القروض القصيرة للأفراد فقط",isCorrect:!1,explanation:"دوره إصدار العملة وإدارة السياسة النقدية والإشراف على البنوك التجارية"},{id:5,type:"tf",q:"التمويل متناهي الصغر يوفر قروضا كبيرة وحصرية للشركات الضخمة فقط",isCorrect:!1,explanation:"يوفر قروض صغيرة لمحدودي الدخل"},{id:6,type:"tf",q:"التمويل الجماعي يتم عبر دعوة عامة للجمهور عبر منصات الإنترنت لدعم فكرة",isCorrect:!0},{id:7,type:"tf",q:"تساهم شركات التأمين في النظام المالي بجمع الأقساط لمواجهة المخاطر واستثمار الأموال",isCorrect:!0},{id:8,type:"tf",q:"تعتبر الجمعية نظاما ادخاريا اجتماعيا يقوم فيه أفراد موثوقون بتجميع مبالغ دورية والتناوب على استلامها",isCorrect:!0},{id:9,type:"tf",q:"انقطاع تدفق التمويل عن الشركات يؤدي لزيادة معدلات التوظيف والتوسع الاقتصادي",isCorrect:!1,explanation:"يؤدي لانخفاض الاستثمار وانكماش النشاط"},{id:10,type:"tf",q:"تساهم تقنيات التمويل والتطبيقات الذكية في وصول الخدمات للفئات النائية وغير القادرة على فتح حسابات",isCorrect:!0},{id:11,type:"term",q:"النظام الذي يربط بين أصحاب الفائض المالي والأطراف التي بحاجة للتمويل",answer:"التمويل"},{id:12,type:"term",q:"آلية حصول الشركات على التمويل مباشرة من الجمهور عبر طرح الأسهم والسندات",answer:"التمويل المباشر"},{id:13,type:"term",q:"العملية التي تتولى فيها المؤسسات المالية كالبنوك الربط بين المودعين والمقترض ة"}],correct:"ب",correctText:"التمويل متناهي الصغر"},{id:35,type:"mcq",q:"العملية التي تقوم بها البنوك للربط بين أصحاب الودائع والراغبين في الاقتراض تسمى",options:[{k:"أ",v:"التضخم"},{k:"ب",v:"الوساطة المالية"},{k:"ج",v:"المقايضة"},{k:"د",v:"الادخار"}],correct:"ب",correctText:"الوساطة المالية"},{id:36,type:"mcq",q:"الوسيلة المالية غير الرسمية التي يتفق فيها مجموعة أفراد موثوقين على دفع مبالغ دورية بالتناوب هي",options:[{k:"أ",v:"السند"},{k:"ب",v:"السهم"},{k:"ج",v:"الجمعية"},{k:"د",v:"الشيك"}],correct:"ج",correctText:"الجمعية"},{id:37,type:"mcq",q:"من النتائج المباشرة لتوقف التمويل",options:[{k:"أ",v:"زيادة الأرباح"},{k:"ب",v:"انخفاض الاستثمار وانكماش النشاط الاقتصادي"},{k:"ج",v:"ارتفاع التوظيف"},{k:"د",v:"زيادة الصادرات"}],correct:"ب",correctText:"انخفاض الاستثمار وانكماش النشاط الاقتصادي"},{id:38,type:"mcq",q:"جمع المبالغ المالية الصغيرة من عدد كبير عبر المنصات الرسمية يسمى",options:[{k:"أ",v:"الادخار"},{k:"ب",v:"التمويل الجماعي Crowdfunding"},{k:"ج",v:"التأمين"},{k:"د",v:"المقايضة"}],correct:"ب",correctText:"التمويل الجماعي Crowdfunding"},{id:39,type:"mcq",q:"الشركات التي تنظم عمليات شراء وبيع الأوراق المالية في البورصة لصالح الأفراد هي",options:[{k:"أ",v:"البنوك المركزية"},{k:"ب",v:"شركات الأوراق المالية (السمسرة)"},{k:"ج",v:"الجمعيات"},{k:"د",v:"شركات الشحن"}],correct:"ب",correctText:"شركات الأوراق المالية (السمسرة)"},{id:40,type:"mcq",q:"تطبيق التكنولوجيا المالية عبر الهواتف الذكية يسهم مباشرة في",options:[{k:"أ",v:"الاستبعاد المالي"},{k:"ب",v:"تعزيز الشمول المالي وتسهيل الوصول للخدمات"},{k:"ج",v:"زيادة التضخم"},{k:"د",v:"إلغاء البنوك"}],correct:"ب",correctText:"تعزيز الشمول المالي وتسهيل الوصول للخدمات"}]},{id:"infra",icon:"\uD83C\uDFD7️",title:"البنية الأساسية",count:40,short:"الدرس الثالث",explanation:[{h:"آلية السوق والأسعار",p:"السوق: نظام أو إطار يلتقي فيه البائعون والمشترون لتبادل السلع والخدمات - ليس مكانا ماديا فحسب بل نظام تتحدد فيه الأسعار والكميات بتفاعل المشترين والبائعين."},{h:"العرض والطلب والتوازن",p:"العرض S: الكمية التي يرغب الناس في بيعها عند مستويات الأسعار المختلفة - تنقص إذا انخفض السعر وتزيد إذا ارتفع - لذلك يصعد منحنى العرض. الطلب D: الكمية التي يرغب الناس في شرائها عند مستويات الأسعار المختلفة - تزيد إذا انخفض السعر وتنقص إذا ارتفع - لذلك يهبط منحنى الطلب. نقطة التوازن E: النقطة التي يتقاطع عندها منحنى العرض والطلب فتتساوى الكمية المطلوبة والمعروضة ويتحدد سعر التوازن والكمية التوازنية. سعر التوازن Pe: السعر عند نقطة التوازن. الكمية التوازنية Qe: الكمية المتداولة عند نقطة التوازن. فائض العرض: إذا ارتفع السعر عن التوازن زادت الكمية المعروضة عن المطلوبة فيبقى الفرق دون بيع - مع بقاء العوامل الأخرى إذا ترك السعر ليتعدل مال إلى الانخفاض. فائض الطلب: إذا انخفض السعر عن التوازن زادت المطلوبة عن المعروضة فنشأ نقص - إذا ترك السعر ليتعدل مال إلى الارتفاع. مع بقاء العوامل الأخرى تتحرك الأسعار في اتجاه يقلل الفائض فتقترب من التوازن."},{h:"المنافسة ومرونة الطلب",p:"المنافسة الكاملة: تتنافس فيها منشآت كثيرة تنافسا حرا فتتبع كل منها سعر السوق. الاحتكار: تسيطر فيه منشأة واحدة على السوق فيكون لها تأثير كبير في السعر. احتكار القلة: تسيطر فيه منشآت قليلة على السوق فتحدد كل منها سعرها ناظرة لما تفعله الأخرى - تختلف طريقة تحديد السعر باختلاف بنية المنافسة. مرونة الطلب السعرية: مقياس درجة استجابة الكمية المطلوبة للتغير في السعر - تكون منخفضة في الضروريات ومرتفعة في السلع التي يستطيع الناس الاستغناء عنها."},{h:"المؤشرات الاقتصادية",p:"لأن النشاط الاقتصادي يصعب رصده مباشرا فهو يفهم بمؤشرات رقمية - وله وجوه كثيرة فلا يعطي مؤشر واحد صورة كاملة لذلك وجب النظر في عدة مؤشرات معا. الناتج المحلي الإجمالي GDP: مجموع القيمة المضافة المتولدة من إنتاج السلع والخدمات داخل الدولة في مدة معينة - يقاس اسميا بالأسعار الجارية أو حقيقيا بعد استبعاد أثر تغير الأسعار - هو المؤشر الأساسي الدال على حجم الاقتصاد - زيادة الحقيقي تدل على زيادة حجم ما أنتج بعد استبعاد أثر الأسعار - غير أنه وحده لا يبين كيف يتوزع الدخل ولا هل تحسنت جودة الحياة. معدل النمو الاقتصادي: النسبة المئوية للتغير في الناتج الحقيقي بالقياس للعام السابق - مثال: إذا زاد من 100 إلى 105 فمعدل النمو (105-100)/100×100=5%. الرقم القياسي لأسعار المستهلكين CPI: يقيس تغير أسعار السلع والخدمات التي تشتريها الأسر. معدل التضخم: النسبة المئوية للتغير في المستوى العام للأسعار - ارتفاع الأسعار ارتفاعا مستمرا = تضخم وانخفاضها = انكماش. معدل البطالة: نسبة العاطلين الباحثين عن عمل والقادرين عليه إلى قوة العمل - ينخفض غالبا إذا تحسن الاقتصاد. الميزان التجاري: الفرق بين قيمة الصادرات والواردات - يكون فائضا إذا زادت الصادرات وعجزا إذا زادت الواردات. الحساب الجاري: الرصيد الذي يضم معاملات السلع والخدمات والدخل المقبوض من الدول الأخرى والمدفوع إليها والتحويلات الجارية. سعر الصرف: السعر الذي تبدل به عملة بأخرى - مثال: إذا تغير من 1 دولار=50 جنيه إلى 1=52 فالدولار أعلى والجنيه أدنى فيرتفع ثمن منتج 20 دولار من 1000 إلى 1040 - والعكس إذا تغير من 50 إلى 48 فالدولار أدنى والجنيه أعلى فينخفض ثمن المنتج من 1000 إلى 960 - إذا ارتفعت قيمة الدولار قد يقبض المصدر بالدولار جنيهات أكثر وفي المقابل قد ترتفع تكلفة الخامات المستوردة - آثار تقلب سعر الصرف تختلف باختلاف قبض العملة الأجنبية أو دفعها واستيراد أو تصدير."},{h:"الأنظمة الاقتصادية وسياسات الاستقرار",p:"سلسلة التوريد: سلسلة العمليات التي تنتقل بها السلعة من توفير الخامات إلى الإنتاج والنقل والبيع حتى تبلغ المستهلك - لأنها متشابكة عالميا فاختلال في موضع يمتد أثره للعالم كله. أنواع الأنظمة: اقتصاد السوق يحدد الطلب والعرض الأسعار والإنتاج. الاقتصاد المخطط تحدد الحكومة الإنتاج والأسعار. الاقتصاد المختلط يقوم على اقتصاد السوق مع تدخل الدولة - هذه نماذج مبسطة لا أقسام جامدة فالدول تجمع بين الاثنين بدرجات - قرار السوق من جهة وقوانين الحكومة وخدماتها وضرائبها وتنظيمها من جهة أخرى. سياسات استقرار الاقتصاد: الرواج الحالة التي ينشط فيها النشاط الاقتصادي ويرتفع معدل النمو - مطلوب لكن يصحبه تضخم في الغالب - تعمل الحكومات والبنوك المركزية على مواجهة التباطؤ وفرط النشاط والضغوط التضخمية. السياسة المالية: تستعمل الحكومة الإنفاق والضرائب أداتين للتأثير في النشاط الاقتصادي. السياسة النقدية: يستعمل البنك المركزي أدوات تؤثر في النقود وشروط الائتمان وأسعار الفائدة - تختلف آثار هاتين السياستين باختلاف الأحوال وقد لا تكون فورية ولا مؤكدة."}],questions:[{id:1,type:"tf",q:"يقصد بالبنية الأساسية للاقتصاد المكونات والهياكل الفنية والمؤسسية التي تعتمد عليها الأنشطة الاقتصادية",isCorrect:!0},{id:2,type:"tf",q:"تقتصر البنية التحتية فقط على الأصول المادية الملموسة مثل الطرق ومحطات الطاقة ولا تشمل القوانين والمؤسسات",isCorrect:!1,explanation:"تشمل الصلبة والناعمة - المادية والمؤسسية"},{id:3,type:"tf",q:"تساهم شبكات المواصلات والنقل الحديثة في خفض تكاليف نقل المواد الخام والمنتجات النهائية",isCorrect:!0},{id:4,type:"tf",q:"توفير الطاقة الكهربائية بانتظام يعتبر شرطا حاسما لضمان تشغيل المصانع والمنشآت دون انقطاع",isCorrect:!0},{id:5,type:"tf",q:"جودة البنية التحتية الرقمية ليس لها تأثير يذكر على كفاءة التعاملات المالية والتجارة الإلكترونية",isCorrect:!1,explanation:"لها تأثير كبير وحاسم"},{id:6,type:"tf",q:"تعرف البنية التحتية الناعمة Soft بأنها المنظومة المؤسسية والتنظيمية والقانونية",isCorrect:!0},{id:7,type:"tf",q:"غياب البنية التحتية المتطورة يعمل على جذب المزيد من الاستثمارات المباشرة",isCorrect:!1,explanation:"يؤدي لعزوف وهروب الاستثمارات"},{id:8,type:"tf",q:"تحمل سلاسل الإمداد والتوريد حركة السلع والخدمات من مرحلة المادة الخام حتى وصولها للمستهلك النهائي",isCorrect:!0},{id:9,type:"tf",q:"التوسع في مشروعات البنية الأساسية القومية يساهم مباشرة في توفير فرص عمل وتقليل البطالة",isCorrect:!0},{id:10,type:"tf",q:"ضعف شبكات الاتصال ومراكز البيانات يؤدي إلى تسريع عمليات التحول الرقمي",isCorrect:!1,explanation:"يؤدي لإبطاء التحول الرقمي"},{id:11,type:"fill",q:"البنية التحتية للاقتصاد تتكون من قسمين رئيسيين: الصلبة و ........",answer:"الناعمة",sentence:"البنية التحتية للاقتصاد تتكون من قسمين رئيسيين: الصلبة والناعمة"},{id:12,type:"fill",q:"تطوير الطرق والموانئ يساعد في خفض ........ التحميل ونقل البضائع",answer:"تكاليف",sentence:"تطوير الطرق والموانئ يساعد في خفض تكاليف التحميل ونقل البضائع"},{id:13,type:"fill",q:"تشكل شبكات ........ العمود الفقري لتشغيل الآلات والمعدات داخل المنشآت",answer:"الطاقة / الكهرباء",sentence:"تشكل شبكات الطاقة / الكهرباء العمود الفقري لتشغيل الآلات والمعدات داخل المنشآت"},{id:14,type:"fill",q:"تتيح البنية التحتية الرقمية المتقدمة إمكانية التوسع في تقديم الخدمات و ........",answer:"التجارة الإلكترونية",sentence:"تتيح البنية التحتية الرقمية المتقدمة إمكانية التوسع في تقديم الخدمات والتجارة الإلكترونية"},{id:15,type:"fill",q:"جودة البنية الأساسية تعد من أهم العوامل المحفزة لجذب ........ الأجنبية والمحلية",answer:"الاستثمارات",sentence:"جودة البنية الأساسية تعد من أهم العوامل المحفزة لجذب الاستثمارات الأجنبية والمحلية"},{id:16,type:"fill",q:"تحمل البنية الناعمة إصلاح وتطوير الأطر ........ والقوانين المنظمة للأسواق",answer:"التنظيمية / القانونية",sentence:"تحمل البنية الناعمة إصلاح وتطوير الأطر التنظيمية / القانونية والقوانين المنظمة للأسواق"},{id:17,type:"fill",q:"الاستثمار الحكومي في مشروعات الطرق والمباني القومية يفتح آفاقا لتوفير فرص ........ جديدة",answer:"العمل / التوظيف",sentence:"الاستثمار الحكومي في مشروعات الطرق والمباني القومية يفتح آفاقا لتوفير فرص العمل والتوظيف جديدة"},{id:18,type:"fill",q:"استمرار إمدادات الطاقة والمياه دون انقطاع يضمن سلامة واستمرارية سلاسل ........",answer:"الإمداد والتوريد",sentence:"استمرار إمدادات الطاقة والمياه دون انقطاع يضمن سلامة واستمرارية سلاسل الإمداد والتوريد"},{id:19,type:"fill",q:"يؤدي الإهمال في تحديث المرافق والخدمات الأساسية إلى تراجع ........ الاقتصادية للدولة",answer:"التنافسية / الكفاءة",sentence:"يؤدي الإهمال في تحديث المرافق والخدمات الأساسية إلى تراجع التنافسية والكفاءة الاقتصادية للدولة"},{id:20,type:"fill",q:"توفير بيئة الاتصال السريعة يساهم في تطبيق مفهوم ........ في المعاملات",answer:"التحول الرقمي",sentence:"توفير بيئة الاتصال السريعة يساهم في تطبيق مفهوم التحول الرقمي في المعاملات"},{id:21,type:"term",q:"المنظومة المادية كالطرق والطاقة والمياه التي تعتمد عليها الأنشطة الاقتصادية",answer:"البنية التحتية الصلبة"},{id:22,type:"term",q:"المنظومة المؤسسية والقانونية والتنظيمية الداعمة للاقتصاد",answer:"البنية التحتية الناعمة Soft"},{id:23,type:"term",q:"سلسلة العمليات التي تنتقل بها السلعة من الخامات إلى المستهلك النهائي",answer:"سلاسل الإمداد والتوريد"},{id:24,type:"term",q:"نظام يلتقي فيه البائعون والمشترون لتحديد الأسعار والكميات",answer:"السوق"},{id:25,type:"term",q:"الكمية التي يرغب البائعون ف  الصحة"},{k:"د",v:"بنية الترفيه"}],correct:"أ",correctText:"بنية الطاقة"},{id:37,type:"mcq",q:"إقامة المشروعات القومية للبنية الأساسية تساعد الدولة في التغلب على مشكلة",options:[{k:"أ",v:"زيادة السكان"},{k:"ب",v:"البطالة من خلال توفير فرص عمل"},{k:"ج",v:"زيادة الواردات"},{k:"د",v:"ارتفاع الحرارة"}],correct:"ب",correctText:"البطالة من خلال توفير فرص عمل"},{id:38,type:"mcq",q:"أي مما يلي يصنف ضمن البنية التحتية الرقمية",options:[{k:"أ",v:"الطرق الترابية"},{k:"ب",v:"السفن الخشبية"},{k:"ج",v:"مراكز البيانات وشبكات الألياف الضوئية"},{k:"د",v:"الأسواق الشعبية"}],correct:"ج",correctText:"مراكز البيانات وشبكات الألياف الضوئية"},{id:39,type:"mcq",q:"الهدف الرئيسي من اهتمام الدول ببناء وتحديث بنيتها الأساسية هو",options:[{k:"أ",v:"تقليل النمو"},{k:"ب",v:"تحفيز النمو الاقتصادي ورفع الكفاءة الإنتاجية"},{k:"ج",v:"زيادة التضخم"},{k:"د",v:"عزل الاقتصاد"}],correct:"ب",correctText:"تحفيز النمو الاقتصادي ورفع الكفاءة الإنتاجية"},{id:40,type:"mcq",q:"انقطاع الطاقة وضعف شبكات المياه يؤثران سلبيا ومباشرة على",options:[{k:"أ",v:"استمرار العملية الإنتاجية داخل المصانع"},{k:"ب",v:"زيادة الأرباح"},{k:"ج",v:"انخفاض الأسعار"},{k:"د",v:"تحسن التعليم"}],correct:"أ",correctText:"استمرار العملية الإنتاجية داخل المصانع"}]},{id:"zakah",icon:"\uD83D\uDD4C",title:"فهم الزكاة",count:40,short:"الدرس الرابع",explanation:[{h:"ما الزكاة وآثارها",p:"أحد أركان الإسلام الخمسة - فريضة يخرج بها المسلم الذي يملك مالا فوق قدر معين جزءا منه ليعاد توزيعه في المجتمع - ليست تبرعا بل فريضة دينية وهي تطهير للمال وسبيل لتحقيق العدالة الاجتماعية - تسهم في الحد من الفقر وتشعر مالكي الثروة بالمسؤولية الاجتماعية. آثارها الاقتصادية: تشجيع تشغيل المال فتدفع الثروة لا إلى الادخار وحده بل إلى الاستثمار - تحريك النشاط الاقتصادي فاستهلاك مستحقيها يولد الطلب - ليست عبادة فحسب بل نظام يسند استقرار المجتمع وتنميته."},{h:"الصدقة والشروط",p:"الصدقة: عطاء تطوعي يختلف عن الزكاة فمقدارها ووقتها ومن تدفع إليه مردود لاختيار صاحبها وقد تعطى لغير المسلمين. من يؤديها ومن يستحقها - الشروط: أن يكون مسلما - أن يبلغ المال النصاب ويقدر بما يعادل 85 جرام ذهب - أن يحول عليه عام كامل بالتقويم الهجري في غير الزروع والثمار فتجب يوم الحصاد - أن يكون تام الملك زائدا على الحاجات الأساسية - بهذه الشروط تصان أصول المعيشة الضرورية ويعتدل توزيع العبء."},{h:"الأنواع والمقادير وزكاة الفطر",p:"تختلف باختلاف نوع المال. الأموال النقدية: 2.5% بعد مرور عام هجري كامل وبلوغ النصاب. الذهب والفضة: 2.5% بعد عام وبلوغ النصاب. الزروع: 10% في السقي الطبيعي و5% في السقي بالكلفة. العقارات: لا زكاة في عقار السكن وإنما في الدخل الإيجاري أو في العقار المعد للتجارة إذا بلغ النصاب. عروض التجارة والأسهم: تحسب بحسب الغرض تجارة أو استثمار وبحسب القيمة - ويختلف تطبيقها باختلاف الشروط وصورة الملكية والغرض والنية - ما هنا عرض عام لا يصلح لتقرير الحكم في الحالات المفردة ويرجع فيها لفتوى عالم مؤهل. زكاة الفطر: صدقة واجبة تؤدى قبل صلاة عيد الفطر عونا للفقراء - تخرج طعاما وتجوز نقدا."},{h:"مصارف الزكاة الثمانية",p:"1- الفقراء: من لا يجدون كفاية حاجاتهم الأساسية 2- المساكين: من لهم دخل لا يكفيهم 3- العاملون عليها: القائمون على جمعها وتوزيعها 4- المؤلفة قلوبهم: من يعطون تأليفا لقلوبهم ورغبة لهم في الإسلام أو تثبيتا لإيمانهم 5- في الرقاب: ما يعان به على تحرير الناس من الرق 6- الغارمون: من أثقلتهم ديون لا يقدرون على سدادها 7- في سبيل الله: ما يصرف في وجوه الخير العامة النافعة للمسلمين 8- ابن السبيل: المسافر الذي انقطعت به الطريق فلا يجد ما يبلغه أهله ووطنه."},{h:"وظائف الزكاة والتمويل الإسلامي",p:"وظائف الزكاة الاجتماعية والاقتصادية: تضع نظاما اجتماعيا فريدا يجمع الدين والأخلاق والاقتصاد - يعمل على الحد من التفاوت الاقتصادي وإعانة الفئات الأشد احتياجا وتوثيق الثقة داخل المجتمع. التمويل الإسلامي: حرم الإسلام كسب الربح بأخذ زيادة على القرض وهو الربا. التمويل الإسلامي يربط العائد بأصول مبايعة أو خدمات أو ترتيبات لتقاسم المنفعة والمخاطر أو معاملات اقتصادية حقيقية - لا يعد موافقا للشريعة بلزوم استيفائها شروطا شتى فليس الاسم وحده هو الذي يقرر موافقتها بل ينظر في عقدها وتنفيذه. أبرز أساليب التمويل الإسلامي ثلاثة: المرابحة صيغة تشتري فيها المؤسسة المالية أصلا ثم تبيعه للعميل ويفصح مقدما عن ثمن الشراء الأول وهامش الربح وجدول السداد ويتفقان عليها - المضاربة ترتيب لتقاسم المخاطر يقدم فيه طرف المال ويتولى الآخر إدارة العمل ويتقاسمان الربح بنسبة ويتحمل المخاطر وفق شروط العقد - المشاركة شهادات استثمار موافقة لأحكام الشريعة مرتبطة بأصول أو خدمات أو أنشطة استثمارية بعينها ويأخذ المستثمرون العوائد التي تولدها تلك الأصول لا باعتبارها ربا على قرض."}],questions:[{id:1,type:"tf",q:"تعتبر الزكاة ركنا أساسيا من أركان الإسلام الخمسة وشكلا واجبا من العطاء المالي",isCorrect:!0},{id:2,type:"tf",q:"يقصد بالنصاب الحد الأدنى من الثروة الذي يشترط بلوغه ليكون واجب دفع الزكاة قائما",isCorrect:!0},{id:3,type:"tf",q:"تجب الزكاة فور امتلاك النصاب دون الحاجة لمرور فترة زمنية محددة (الحول)",isCorrect:!1,explanation:"يشترط الحول في غير الزروع والثمار"},{id:4,type:"tf",q:"الفرق بين الزكاة والصدقة أن الزكاة واجب بمبالغ ومستحقين محددين شرعا بينما الصدقة تطوعية",isCorrect:!0},{id:5,type:"tf",q:"تتحقق زكاة المال بأنها واجب مشروع بحجم الثروة ومرور الحول بينما زكاة الفطر مرتبطة بالأفراد وتدفع أساسا طعاما",isCorrect:!0},{id:6,type:"tf",q:"يعد الشخص الذي يملك ثروة فائقة تتجاوز النصاب مستحقا لأخذ أموال الزكاة",isCorrect:!1,explanation:"بل هو من يؤديها وليس من يأخذها"},{id:7,type:"tf",q:"تساعد أموال الزكاة في تقليل التفاوت الاقتصادي والاجتماعي وإعادة توزيع الثروة",isCorrect:!0},{id:8,type:"tf",q:"الزكاة والضرائب متطابقتان تماما من حيث مصدر الوجوب والجهة المحصلة والأهداف الشرعية",isCorrect:!1,explanation:"الزكاة فريضة دينية مصرفها محدد شرعا والضرائب التزام قانوني مدني تنظمه الدولة"},{id:9,type:"tf",q:"المسافر الذي نفد ماله واحتاج صعوبة في العودة لبلده (ابن السبيل) يعتبر من مستحقي الزكاة شرعا",isCorrect:!0},{id:10,type:"tf",q:"إنفاق مستحقي الزكاة للأموال التي يتلقونها على احتياجاتهم يساهم في تنشيط حركة المال والدخل في السوق",isCorrect:!0},{id:11,type:"term",q:"الحد الأدنى من الثروة الذي يشترط بلوغه لوجوب الزكاة",answer:"النصاب - ما يعادل 85 جرام ذهب"},{id:12,type:"term",q:"مرور سنة قمرية كاملة على مال بلغ النصاب",answer:"الحول (السنة القمرية)"},{id:13,type:"term",q:"زكاة واجبة على الأموال النقدية والذهب إذا بلغت النصاب وحال الحول 2.5%",answer:"زكاة المال"},{id:14,ty
